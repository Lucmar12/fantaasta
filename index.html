/* ---------- Supabase backend ----------
   Lo stato dell'asta vive nello schema relazionale `fanta` (auctions, teams,
   players, assignments) su Supabase, sincronizzato in realtime tra tutti i
   dispositivi collegati alla stessa asta. */
const SUPABASE_URL = "https://idoyhbdgxsirnysgxmqh.supabase.co";
const SUPABASE_KEY = "sb_publishable_Cn2peORmtyEVnA1vHl2UOw_oUDGc0NF";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
  db: { schema: "fanta" },
});

const Db = {
  async getOrCreateAuction() {
    const { data: rows, error } = await sb
      .from("auctions")
      .select("*")
      .order("created_at", { ascending: true })
      .limit(1);
    if (error) throw error;
    if (rows.length) return rows[0];
    const { data, error: insErr } = await sb.from("auctions").insert({}).select().single();
    if (insErr) throw insErr;
    return data;
  },

  async getOrCreateTeams(auctionId) {
    const { data: existing, error } = await sb
      .from("teams")
      .select("*")
      .eq("auction_id", auctionId)
      .order("slot");
    if (error) throw error;
    const have = new Set(existing.map((t) => t.slot));
    const missing = [];
    for (let i = 0; i < 10; i++) {
      if (!have.has(i)) {
        missing.push({ auction_id: auctionId, slot: i, name: i === 0 ? "La mia squadra" : `Squadra ${i + 1}` });
      }
    }
    if (!missing.length) return existing;
    const { error: insErr } = await sb.from("teams").insert(missing);
    if (insErr) throw insErr;
    const { data: all, error: reErr } = await sb
      .from("teams")
      .select("*")
      .eq("auction_id", auctionId)
      .order("slot");
    if (reErr) throw reErr;
    return all;
  },

  async loadAssignments(auctionId) {
    const { data, error } = await sb.from("assignments").select("*").eq("auction_id", auctionId).order("seq");
    if (error) throw error;
    return data;
  },

  async loadPlayers(auctionId) {
    const { data, error } = await sb.from("players").select("*").eq("auction_id", auctionId).order("name");
    if (error) throw error;
    return data;
  },

  async updateAuctionSettings(auctionId, { budget, roster }) {
    const { error } = await sb
      .from("auctions")
      .update({ budget, roster })
      .eq("id", auctionId);
    if (error) throw error;
  },

  async renameTeam(teamDbId, name) {
    const { error } = await sb.from("teams").update({ name }).eq("id", teamDbId);
    if (error) throw error;
  },

  async resetTeamNames(auctionId, teamDbIdBySlot) {
    for (let slot = 0; slot < 10; slot++) {
      const dbId = teamDbIdBySlot.get(slot);
      if (!dbId) continue;
      const name = slot === 0 ? "La mia squadra" : `Squadra ${slot + 1}`;
      await sb.from("teams").update({ name }).eq("id", dbId);
    }
  },

  async insertAssignment(auctionId, teamDbId, name, role, price) {
    const { data, error } = await sb
      .from("assignments")
      .insert({ auction_id: auctionId, team_id: teamDbId, player_name: name, role, price })
      .select()
      .single();
    if (error) throw error;
    return data;
  },

  async deleteAssignment(assignmentId) {
    const { error } = await sb.from("assignments").delete().eq("id", assignmentId);
    if (error) throw error;
  },

  async clearAssignments(auctionId) {
    const { error } = await sb.from("assignments").delete().eq("auction_id", auctionId);
    if (error) throw error;
  },

  async replacePlayers(auctionId, players) {
    const { error: delErr } = await sb.from("players").delete().eq("auction_id", auctionId);
    if (delErr) throw delErr;
    if (!players.length) return;
    const rows = players.map((p) => ({
      auction_id: auctionId,
      name: p.name,
      role: p.role,
      team: p.team || null,
      price: p.price,
    }));
    const { error: insErr } = await sb.from("players").insert(rows);
    if (insErr) throw insErr;
  },
};

function assembleTeams(teamRows, assignmentRows) {
  const byTeamDbId = new Map(teamRows.map((t) => [t.id, []]));
  assignmentRows.forEach((a) => {
    const arr = byTeamDbId.get(a.team_id);
    if (arr) arr.push({ id: a.id, name: a.player_name, role: a.role, price: a.price, order: Number(a.seq) });
  });
  return teamRows
    .slice()
    .sort((a, b) => a.slot - b.slot)
    .map((t) => ({ id: t.slot, name: t.name, players: byTeamDbId.get(t.id) || [] }));
}

  id: `${name.toLowerCase()}-${role}-${team.toLowerCase()}`,
  name,
  role,
  team,
  price,

const defaultTeams = () =>
  Array.from({ length: 10 }, (_, i) => ({
    id: i,
    name: i === 0 ? "La mia squadra" : `Squadra ${i + 1}`,
    players: [],
  }));

const defaultSettings = () => ({
  budget: 750,
  roster: { P: 3, D: 10, C: 10, A: 7 },
});

let orderCounter = 0;

/* ---------- import parsing ---------- */

function normRole(raw) {
  const s = (raw || "").trim().toUpperCase();
  if (ROLE_KEYS.includes(s)) return s;
  if (s.startsWith("POR")) return "P";
  if (s.startsWith("DIF") || s === "DC" || s === "DD" || s === "DS" || s === "E") return "D";
  if (s.startsWith("CEN") || s === "M" || s === "W" || s === "T") return "C";
  if (s.startsWith("ATT") || s === "PC") return "A";
  return null;
}

function parseDatabase(text) {
  const lines = text.split(/\r?\n/).map((l) => l.trim()).filter(Boolean);
  const players = [];
  for (const line of lines) {
    const parts = line.split(/[;,\t]/).map((p) => p.trim());
    if (parts.length < 2) continue;
    const [name, roleRaw, team, priceRaw] = parts;
    const role = normRole(roleRaw);
    if (!name || !role) continue;
    if (/^nome$/i.test(name)) continue; // skip header row
    const price = parseInt((priceRaw || "").replace(/[^\d]/g, ""), 10);
    players.push({
      id: `${name}-${role}-${team || ""}`.toLowerCase(),
      name,
      role,
      team: team || "",
      price: isNaN(price) ? null : price,
    });
  }
  return players;
}

/* ---------- component ---------- */

function AstaFantacalcio() {
  const [loaded, setLoaded] = useState(false);
  const [saveError, setSaveError] = useState(false);
  const [teams, setTeams] = useState(defaultTeams());
  const [settings, setSettings] = useState(defaultSettings());
  const [playerDB, setPlayerDB] = useState([]);
  const [view, setView] = useState("board"); // board | quick | listone | log | setup
  const [expandedTeam, setExpandedTeam] = useState(null);
  const [form, setForm] = useState({ name: "", role: "D", teamId: 0, price: "" });
  const [confirmClear, setConfirmClear] = useState(false);
  const [quickCallOpen, setQuickCallOpen] = useState(false);
  const [quickCallInitial, setQuickCallInitial] = useState(null);
  const [importText, setImportText] = useState("");
  const [importMsg, setImportMsg] = useState("");

  const [auctionId, setAuctionId] = useState(null);
  const teamDbIdRef = useRef(new Map()); // slot -> uuid

  const reloadTeams = useCallback(async (id) => {
    const teamRows = await Db.getOrCreateTeams(id);
    const assignmentRows = await Db.loadAssignments(id);
    teamDbIdRef.current = new Map(teamRows.map((t) => [t.slot, t.id]));
    setTeams(assembleTeams(teamRows, assignmentRows));
    return assignmentRows;
  }, []);

  /* load */
  useEffect(() => {
    let cancelled = false;
    (async () => {
      try {
        const auction = await Db.getOrCreateAuction();
        if (cancelled) return;
        setAuctionId(auction.id);
        setSettings({ budget: auction.budget, roster: auction.roster });

        const assignmentRows = await reloadTeams(auction.id);
        orderCounter = assignmentRows.reduce((m, a) => Math.max(m, Number(a.seq) || 0), 0) + 1;

        const playerRows = await Db.loadPlayers(auction.id);
        if (playerRows.length) {
          setPlayerDB(
            playerRows.map((p) => ({
              id: `${p.name}-${p.role}-${p.team || ""}`.toLowerCase(),
              name: p.name,
              role: p.role,
              team: p.team || "",
              price: p.price,
            }))
          );
        } else {
          setPlayerDB(DEFAULT_PLAYERS);
          await Db.replacePlayers(auction.id, DEFAULT_PLAYERS);
        }
        setSaveError(false);
      } catch (e) {
        console.error(e);
        setSaveError(true);
      } finally {
        if (!cancelled) setLoaded(true);
      }
    })();
    return () => {
      cancelled = true;
    };
  }, [reloadTeams]);

  /* realtime: tieni sincronizzati tutti i dispositivi collegati alla stessa asta */
  useEffect(() => {
    if (!auctionId) return;
    const onRemoteChange = () => {
      reloadTeams(auctionId).catch(() => setSaveError(true));
    };
    const channel = sb
      .channel(`asta-${auctionId}`)
      .on("postgres_changes", { event: "*", schema: "fanta", table: "assignments", filter: `auction_id=eq.${auctionId}` }, onRemoteChange)
      .on("postgres_changes", { event: "*", schema: "fanta", table: "teams", filter: `auction_id=eq.${auctionId}` }, onRemoteChange)
      .on("postgres_changes", { event: "*", schema: "fanta", table: "auctions", filter: `id=eq.${auctionId}` }, (payload) => {
        if (payload.new) setSettings({ budget: payload.new.budget, roster: payload.new.roster });
      })
      .subscribe();
    return () => {
      sb.removeChannel(channel);
    };
  }, [auctionId, reloadTeams]);

  const updateSettings = (updater) => {
    setSettings((prev) => {
      const next = updater(prev);
      Db.updateAuctionSettings(auctionId, next).catch(() => setSaveError(true));
      return next;
    });
  };

  /* derived */
  const totals = useMemo(() => {
    const totalSlots = 10 * Object.values(settings.roster).reduce((a, b) => a + b, 0);
    const totalBudget = 10 * settings.budget;
    let spent = 0;
    let bought = 0;
    teams.forEach((t) => {
      t.players.forEach((p) => {
        spent += p.price;
        bought += 1;
      });
    });
    return { totalSlots, totalBudget, spent, bought, remaining: totalBudget - spent, slotsLeft: totalSlots - bought };
  }, [teams, settings]);

  const teamStats = useCallback(
    (team) => {
      const spent = team.players.reduce((s, p) => s + p.price, 0);
      const remaining = settings.budget - spent;
      const roleCounts = { P: 0, D: 0, C: 0, A: 0 };
      team.players.forEach((p) => (roleCounts[p.role] += 1));
      const slotsTotal = Object.values(settings.roster).reduce((a, b) => a + b, 0);
      const slotsUsed = team.players.length;
      return { spent, remaining, roleCounts, slotsUsed, slotsTotal };
    },
    [settings]
  );

  const allLog = useMemo(() => {
    return teams
      .flatMap((t) => t.players.map((p) => ({ ...p, teamName: t.name, teamId: t.id })))
      .sort((a, b) => b.order - a.order);
  }, [teams]);

  const soldMap = useMemo(() => {
    const m = new Map();
    teams.forEach((t) => {
      t.players.forEach((p) => {
        m.set(`${p.name.toLowerCase()}|${p.role}`, { teamName: t.name, price: p.price });
      });
    });
    return m;
  }, [teams]);

  /* actions */
  const addPlayer = (overrides) => {
    const name = (overrides?.name ?? form.name).trim();
    const role = overrides?.role ?? form.role;
    const teamId = overrides?.teamId ?? form.teamId;
    const priceRaw = overrides?.price ?? form.price;
    const price = parseInt(priceRaw, 10);
    if (!name || isNaN(price) || price < 0) return false;
    const team = teams.find((t) => t.id === teamId);
    if (!team) return false;
    const stats = teamStats(team);
    if (stats.roleCounts[role] >= settings.roster[role]) {
      if (!window.confirm(`${team.name} ha già raggiunto il limite per il ruolo ${role}. Aggiungere comunque?`)) return false;
    }
    if (price > stats.remaining) {
      if (!window.confirm(`${team.name} non ha abbastanza crediti rimanenti (${stats.remaining}). Registrare comunque?`)) return false;
    }
    const teamDbId = teamDbIdRef.current.get(teamId);
    if (!teamDbId) return false;
    (async () => {
      try {
        const row = await Db.insertAssignment(auctionId, teamDbId, name, role, price);
        const entry = { id: row.id, name: row.player_name, role: row.role, price: row.price, order: Number(row.seq) };
        orderCounter = Math.max(orderCounter, entry.order + 1);
        setTeams((prev) => prev.map((t) => (t.id === teamId ? { ...t, players: [...t.players, entry] } : t)));
      } catch (e) {
        if (e.code === "23505") {
          window.alert(`${name} è già stato assegnato in questa asta.`);
        } else {
          setSaveError(true);
        }
      }
    })();
    setForm({ name: "", role, teamId, price: "" });
    return true;
  };

  const removePlayer = (teamId, playerId) => {
    setTeams((prev) =>
      prev.map((t) => (t.id === teamId ? { ...t, players: t.players.filter((p) => p.id !== playerId) } : t))
    );
    Db.deleteAssignment(playerId).catch(() => setSaveError(true));
  };

  const renameTeam = (teamId, name) => {
    setTeams((prev) => prev.map((t) => (t.id === teamId ? { ...t, name } : t)));
    const dbId = teamDbIdRef.current.get(teamId);
    if (dbId) Db.renameTeam(dbId, name).catch(() => setSaveError(true));
  };

  const clearAll = () => {
    const fresh = defaultTeams();
    orderCounter = 0;
    setTeams(fresh);
    setConfirmClear(false);
    (async () => {
      try {
        await Db.clearAssignments(auctionId);
        await Db.resetTeamNames(auctionId, teamDbIdRef.current);
      } catch (e) {
        setSaveError(true);
      }
    })();
  };

  const doImport = () => {
    const parsed = parseDatabase(importText);
    if (parsed.length === 0) {
      setImportMsg("Nessun giocatore riconosciuto. Controlla il formato.");
      return;
    }
    setPlayerDB(parsed);
    Db.replacePlayers(auctionId, parsed).catch(() => setSaveError(true));
    setImportText("");
    setImportMsg(`Importati ${parsed.length} giocatori.`);
  };

  const resetDB = () => {
    setPlayerDB(DEFAULT_PLAYERS);
    Db.replacePlayers(auctionId, DEFAULT_PLAYERS).catch(() => setSaveError(true));
    setImportMsg(`Listone ripristinato (${DEFAULT_PLAYERS.length} giocatori).`);
  };

  const clearDB = async () => {

      {view === "board" && (

      {view === "listone" && (

      {view === "setup" && (
        <SetupView
          teams={teams}
          settings={settings}
          renameTeam={renameTeam}
          updateSettings={updateSettings}
          confirmClear={confirmClear}
          setConfirmClear={setConfirmClear}
          clearAll={clearAll}
          importText={importText}

/* Piano crediti per "La mia squadra" (id 0), basato sulla strategia 4-3-3 discussa:
   1 big da 300+ in attacco, centrocampo/difesa alleggeriti sui riempitivi. */
const MY_TEAM_PLAN = {
  P: [27, 9, 9],
  D: [20, 20, 20, 20, 10, 10, 5, 5, 5, 5],
  C: [24, 23, 23, 8, 8, 8, 5, 5, 5, 5],
  A: [300, 65, 45, 45, 5, 5, 5],
};

function nextTarget(role, usedCount) {
  const plan = MY_TEAM_PLAN[role];
  if (!plan || usedCount >= plan.length) return null;
  return plan[usedCount];
}

function ListoneView({ playerDB, soldMap, onPick }) {
  const [search, setSearch] = useState("");
  const [roleFilter, setRoleFilter] = useState("ALL");
  const [teamFilter, setTeamFilter] = useState("ALL");
  const [onlyAvailable, setOnlyAvailable] = useState(true);
  const [limit, setLimit] = useState(60);

  const teamOptions = useMemo(() => {
    const set = new Set(playerDB.map((p) => p.team).filter(Boolean));
    return Array.from(set).sort((a, b) => a.localeCompare(b));
  }, [playerDB]);

  const filtered = useMemo(() => {
    let list = playerDB;
    if (roleFilter !== "ALL") list = list.filter((p) => p.role === roleFilter);
    if (teamFilter !== "ALL") list = list.filter((p) => p.team === teamFilter);
    if (search.trim()) {
      const q = search.trim().toLowerCase();
      list = list.filter((p) => p.name.toLowerCase().includes(q));
    }
    if (onlyAvailable) {
      list = list.filter((p) => !soldMap.has(`${p.name.toLowerCase()}|${p.role}`));
    }
    return [...list].sort((a, b) => (b.price ?? 0) - (a.price ?? 0));
  }, [playerDB, search, roleFilter, teamFilter, onlyAvailable, soldMap]);

  useEffect(() => {
    setLimit(60);
  }, [search, roleFilter, teamFilter, onlyAvailable]);

  if (playerDB.length === 0) {
    return (
      <div className="px-4 py-10 text-center" style={{ color: "rgba(243,239,228,0.5)" }}>
        Nessun listone caricato. Vai in Impostazioni → "Carica listone" per importare i giocatori.
      </div>
    );
  }

  const visible = filtered.slice(0, limit);

  return (
    <div className="px-3 mt-1 flex flex-col gap-2 pb-4">
      <input
        placeholder="Cerca giocatore…"
        value={search}
        onChange={(e) => setSearch(e.target.value)}
        className="w-full rounded-lg px-3 py-2 text-sm"
        style={{ background: CARD_BG, color: CREAM, border: "1px solid rgba(243,239,228,0.14)" }}
      />

      <div className="flex gap-1.5 overflow-x-auto">
        {[["ALL", "Tutti"], ...ROLES.map((r) => [r.key, r.label])].map(([key, label]) => (
          <button
            key={key}
            onClick={() => setRoleFilter(key)}
            className="text-xs font-semibold px-2.5 py-1.5 rounded-lg whitespace-nowrap"
            style={{
              background: roleFilter === key ? (key === "ALL" ? GOLD : roleColor(key)) : "rgba(243,239,228,0.08)",
              color: roleFilter === key ? BG : CREAM,
            }}
          >
            {label}
          </button>
        ))}
      </div>

      <div className="flex gap-2 items-center">
        <select
          value={teamFilter}
          onChange={(e) => setTeamFilter(e.target.value)}
          className="flex-1 rounded-lg px-2 py-1.5 text-xs"
          style={{ background: CARD_BG, color: CREAM, border: "1px solid rgba(243,239,228,0.14)" }}
        >
          <option value="ALL">Tutte le squadre</option>
          {teamOptions.map((t) => (
            <option key={t} value={t}>
              {t}
            </option>
          ))}
        </select>
        <button
          onClick={() => setOnlyAvailable((v) => !v)}
          className="text-xs font-semibold px-2.5 py-1.5 rounded-lg whitespace-nowrap"
          style={{
            background: onlyAvailable ? GOLD : "rgba(243,239,228,0.08)",
            color: onlyAvailable ? BG : CREAM,
          }}
        >
          Solo liberi
        </button>
      </div>

      <div className="text-[11px]" style={{ color: "rgba(243,239,228,0.4)" }}>
        {filtered.length} giocatori
      </div>

      <div className="flex flex-col gap-1">
        {visible.map((p) => {
          const sold = soldMap.get(`${p.name.toLowerCase()}|${p.role}`);
          return (
            <button
              key={p.id}
              onClick={() => !sold && onPick(p)}
              disabled={!!sold}
              className="flex items-center justify-between rounded-lg px-3 py-2 text-left"
              style={{ background: CARD_BG, opacity: sold ? 0.45 : 1 }}
            >
              <div className="flex items-center gap-2 min-w-0">
                <span
                  className="text-[10px] font-bold w-5 h-5 flex items-center justify-center rounded shrink-0"
                  style={{ background: roleColor(p.role) + "26", color: roleColor(p.role) }}
                >
                  {p.role}
                </span>
                <div className="min-w-0">
                  <div className="text-sm truncate" style={{ color: CREAM }}>
                    {p.name}
                  </div>
                  <div className="text-[11px] truncate" style={{ color: "rgba(243,239,228,0.5)" }}>
                    {sold ? `venduto a ${sold.teamName} · ${sold.price}cr` : p.team}
                  </div>
                </div>
              </div>
              <span className="text-sm font-semibold tabular-nums shrink-0 ml-2" style={{ color: GOLD, fontFamily: MONO_FONT }}>
                {p.price ?? "—"}
              </span>
            </button>
          );
        })}
      </div>

      {filtered.length > visible.length && (
        <button
          onClick={() => setLimit((l) => l + 60)}
          className="rounded-lg py-2 text-xs font-semibold"
          style={{ background: "rgba(243,239,228,0.08)", color: CREAM }}
        >
          Mostra altri ({filtered.length - visible.length})
        </button>
      )}
    </div>
  );
}

function QuickCallModal({ teams, settings, teamStats, playerDB, soldMap, addPlayer, initial, onClose }) {
  const [name, setName] = useState(initial?.name || "");
  const [role, setRole] = useState(initial?.role || "D");
  const [teamId, setTeamId] = useState(0);
  const [price, setPrice] = useState("");
  const [locked, setLocked] = useState(!!initial?.name);
  const priceRef = useRef(null);
  const nameRef = useRef(null);

  useEffect(() => {
    if (locked) priceRef.current?.focus();
    else nameRef.current?.focus();
  }, [locked]);

  const suggestions = useMemo(() => {
    if (locked || !name.trim()) return [];
    const q = name.trim().toLowerCase();
    return playerDB
      .filter((p) => p.name.toLowerCase().includes(q) && !soldMap.has(`${p.name.toLowerCase()}|${p.role}`))
      .slice(0, 6);
  }, [name, playerDB, soldMap, locked]);

  const quota = useMemo(() => {
    const hit = playerDB.find((p) => p.name.toLowerCase() === name.trim().toLowerCase() && p.role === role);
    return hit?.price ?? null;
  }, [name, role, playerDB]);

  const selectedTeam = teams.find((t) => t.id === teamId);
  const stats = selectedTeam ? teamStats(selectedTeam) : null;
  const target = teamId === 0 && stats ? nextTarget(role, stats.roleCounts[role]) : null;

  const submit = () => {
    const ok = addPlayer({ name, role, teamId, price });
    if (ok) onClose();
  };

  return (
    <div
      className="fixed inset-0 z-40 flex items-end justify-center"
      style={{ background: "rgba(0,0,0,0.55)" }}
      onClick={onClose}
    >
      <div
        className="w-full max-w-md rounded-t-2xl px-4 pt-4 pb-6 flex flex-col gap-3"
        style={{ background: CARD_BG, maxHeight: "92vh", overflowY: "auto" }}
        onClick={(e) => e.stopPropagation()}
      >
        <div className="flex items-center justify-between">
          <div className="font-bold text-lg" style={{ color: CREAM, fontFamily: DISPLAY_FONT }}>
            Assegna giocatore
          </div>
          <button onClick={onClose} className="text-sm px-2 py-1" style={{ color: "rgba(243,239,228,0.6)" }}>
            Chiudi
          </button>
        </div>

        <div className="relative">
          <input
            ref={nameRef}
            placeholder="Nome giocatore"
            value={name}
            onChange={(e) => {
              setName(e.target.value);
              setLocked(false);
            }}
            className="w-full rounded-lg px-3 py-2.5 text-sm"
            style={{ background: "rgba(243,239,228,0.07)", color: CREAM, border: "1px solid rgba(243,239,228,0.14)" }}
          />
          {suggestions.length > 0 && (
            <div
              className="absolute left-0 right-0 top-full mt-1 rounded-lg overflow-hidden z-10"
              style={{ background: "#1B5A46", border: "1px solid rgba(243,239,228,0.14)" }}
            >
              {suggestions.map((p) => (
                <button
                  key={p.id}
                  onClick={() => {
                    setName(p.name);
                    setRole(p.role);
                    setLocked(true);
                  }}
                  className="w-full flex items-center justify-between px-3 py-2 text-left"
                >
                  <span className="flex items-center gap-2 min-w-0">
                    <span
                      className="text-[10px] font-bold w-5 h-5 flex items-center justify-center rounded shrink-0"
                      style={{ background: roleColor(p.role) + "26", color: roleColor(p.role) }}
                    >
                      {p.role}
                    </span>
                    <span className="text-sm truncate" style={{ color: CREAM }}>
                      {p.name}
                    </span>
                    <span className="text-[11px] shrink-0" style={{ color: "rgba(243,239,228,0.45)" }}>
                      {p.team}
                    </span>
                  </span>
                  <span className="text-xs font-semibold tabular-nums" style={{ color: GOLD, fontFamily: MONO_FONT }}>
                    {p.price ?? "—"}
                  </span>
                </button>
              ))}
            </div>
          )}
        </div>

        <div className="flex gap-1.5">
          {ROLES.map((r) => (
            <button
              key={r.key}
              onClick={() => setRole(r.key)}
              className="flex-1 py-2 rounded-lg text-xs font-bold"
              style={{
                background: role === r.key ? r.color : "rgba(243,239,228,0.08)",
                color: role === r.key ? BG : CREAM,
              }}
            >
              {r.key}
            </button>
          ))}
        </div>

        <select
          value={teamId}
          onChange={(e) => setTeamId(parseInt(e.target.value, 10))}
          className="w-full rounded-lg px-3 py-2.5 text-sm"
          style={{ background: "rgba(243,239,228,0.07)", color: CREAM, border: "1px solid rgba(243,239,228,0.14)" }}
        >
          {teams.map((t) => {
            const s = teamStats(t);
            return (
              <option key={t.id} value={t.id}>
                {t.name} — {s.remaining} cr
              </option>
            );
          })}
        </select>

        <input
          ref={priceRef}
          type="number"
          inputMode="numeric"
          placeholder="Prezzo pagato"
          value={price}
          onChange={(e) => setPrice(e.target.value)}
          onKeyDown={(e) => e.key === "Enter" && submit()}
          className="w-full rounded-lg px-3 py-2.5 text-lg font-bold tabular-nums"
          style={{
            background: "rgba(243,239,228,0.07)",
            color: GOLD,
            fontFamily: MONO_FONT,
            border: "1px solid rgba(243,239,228,0.14)",
          }}
        />

        <div className="flex flex-wrap gap-x-3 gap-y-1 text-[11px]" style={{ color: "rgba(243,239,228,0.55)" }}>
          {quota != null && <span>Quotazione: {quota} cr</span>}
          {stats && (
            <span>
              {selectedTeam.name}: {stats.roleCounts[role]}/{settings.roster[role]} {role} · {stats.remaining} cr
            </span>
          )}
          {target != null && <span style={{ color: GOLD }}>Piano: {target} cr</span>}
        </div>

        <button
          onClick={submit}
          disabled={!name.trim() || price === ""}
          className="w-full rounded-xl py-3 font-bold"
          style={{
            background: !name.trim() || price === "" ? "rgba(243,239,228,0.15)" : GOLD,
            color: !name.trim() || price === "" ? "rgba(243,239,228,0.4)" : BG,
            fontFamily: DISPLAY_FONT,
          }}
        >
          Registra
        </button>
      </div>
    </div>
  );
}

function SetupView({
  teams,
  settings,
  renameTeam,
  updateSettings,
  confirmClear,
  setConfirmClear,
  clearAll,
  importText,
  setImportText,
  doImport,
  importMsg,
  playerDB,
  clearDB,
  resetDB,
}) {
  const inputStyle = {
    background: "rgba(243,239,228,0.07)",
    color: CREAM,
    border: "1px solid rgba(243,239,228,0.14)",
  };
  const sectionTitle = { color: CREAM, fontFamily: DISPLAY_FONT };

  return (
    <div className="px-3 mt-1 flex flex-col gap-3 pb-10">
      <div className="rounded-xl p-3" style={{ background: CARD_BG }}>
        <div className="font-semibold mb-2" style={sectionTitle}>
          Squadre
        </div>
        <div className="flex flex-col gap-1.5">
          {teams.map((t) => (
            <input
              key={t.id}
              value={t.name}
              onChange={(e) => renameTeam(t.id, e.target.value)}
              className="w-full rounded-lg px-3 py-2 text-sm"
              style={inputStyle}
            />
          ))}
        </div>
      </div>

      <div className="rounded-xl p-3" style={{ background: CARD_BG }}>
        <div className="font-semibold mb-2" style={sectionTitle}>
          Budget e rosa
        </div>
        <label className="block text-[11px] mb-1" style={{ color: "rgba(243,239,228,0.55)" }}>
          Crediti per squadra
        </label>
        <input
          type="number"
          inputMode="numeric"
          value={settings.budget}
          onChange={(e) => {
            const v = parseInt(e.target.value, 10);
            updateSettings((s) => ({ ...s, budget: isNaN(v) ? 0 : v }));
          }}
          className="w-full rounded-lg px-3 py-2 text-sm tabular-nums mb-3"
          style={{ ...inputStyle, fontFamily: MONO_FONT }}
        />
        <div className="grid grid-cols-4 gap-2">
          {ROLES.map((r) => (
            <div key={r.key}>
              <label className="block text-[11px] mb-1" style={{ color: r.color }}>
                {r.key}
              </label>
              <input
                type="number"
                inputMode="numeric"
                value={settings.roster[r.key]}
                onChange={(e) => {
                  const v = parseInt(e.target.value, 10);
                  updateSettings((s) => ({
                    ...s,
                    roster: { ...s.roster, [r.key]: isNaN(v) ? 0 : v },
                  }));
                }}
                className="w-full rounded-lg px-2 py-2 text-sm tabular-nums"
                style={{ ...inputStyle, fontFamily: MONO_FONT }}
              />
            </div>
          ))}
        </div>
      </div>

      <div className="rounded-xl p-3" style={{ background: CARD_BG }}>
        <div className="font-semibold mb-1" style={sectionTitle}>
          Carica listone
        </div>
        <div className="text-[11px] mb-2" style={{ color: "rgba(243,239,228,0.5)" }}>
          Una riga per giocatore: <span style={{ fontFamily: MONO_FONT }}>Nome;Ruolo;Squadra;Quotazione</span> —
          separatori ammessi: <span style={{ fontFamily: MONO_FONT }}>; , tab</span>. Sostituisce il listone attuale
          ({playerDB.length} giocatori).
        </div>
        <textarea
          value={importText}
          onChange={(e) => setImportText(e.target.value)}
          rows={5}
          placeholder={"Lautaro Martinez;A;Inter;55\nBastoni;D;Inter;21"}
          className="w-full rounded-lg px-3 py-2 text-xs"
          style={{ ...inputStyle, fontFamily: MONO_FONT }}
        />
        <div className="flex gap-2 mt-2">
          <button
            onClick={doImport}
            className="flex-1 rounded-lg py-2 text-sm font-semibold"
            style={{ background: GOLD, color: BG }}
          >
            Importa
          </button>
          <button
            onClick={resetDB}
            className="rounded-lg px-3 py-2 text-sm font-semibold"
            style={{ background: "rgba(243,239,228,0.08)", color: CREAM }}
          >
            Ripristina
          </button>
          <button
            onClick={clearDB}
            className="rounded-lg px-3 py-2 text-sm font-semibold"
            style={{ background: "rgba(243,239,228,0.08)", color: DANGER }}
          >
            Svuota
          </button>
        </div>
        {importMsg && (
          <div className="text-[11px] mt-2" style={{ color: GOLD }}>
            {importMsg}
          </div>
        )}
      </div>

      <div className="rounded-xl p-3" style={{ background: CARD_BG }}>
        <div className="font-semibold mb-2" style={sectionTitle}>
          Azzera asta
        </div>
        <div className="text-[11px] mb-2" style={{ color: "rgba(243,239,228,0.5)" }}>
          Cancella tutti i giocatori assegnati. Nomi squadre, budget e listone restano.
        </div>
        {confirmClear ? (
          <div className="flex gap-2">
            <button
              onClick={clearAll}
              className="flex-1 rounded-lg py-2 text-sm font-semibold"
              style={{ background: DANGER, color: CREAM }}
            >
              Conferma azzeramento
            </button>
            <button
              onClick={() => setConfirmClear(false)}
              className="rounded-lg px-3 py-2 text-sm font-semibold"
              style={{ background: "rgba(243,239,228,0.08)", color: CREAM }}
            >
              Annulla
            </button>
          </div>
        ) : (
          <button
            onClick={() => setConfirmClear(true)}
            className="w-full rounded-lg py-2 text-sm font-semibold"
            style={{ background: "rgba(224,108,92,0.18)", color: DANGER }}
          >
            Azzera tutti i giocatori
          </button>
        )}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<AstaFantacalcio />);

</script>
</body>
</html>
